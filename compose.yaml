services:
  wire-pod:
    container_name: wire-pod
    build:
      context: .
      dockerfile: dockerfile
    image: jackwuwei/wire-pod-chinese:latest
    restart: unless-stopped
    environment:
      WIREPOD_DATA_DIR: /data
    # host 网络：wire-pod 按连接来源记录机器人 IP，端口映射(NAT)会记成 Docker 网关，
    # 导致 SDK 连回 wire-pod 自己（unknown service ExternalInterface）；mDNS 也需要 host 网络。
    # 仅 Linux 宿主机有效，Docker Desktop (Windows/Mac) 不支持。
    network_mode: host
    volumes:
      - wire-pod-data:/data
      - wire-pod-images:/images
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/ok" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  wire-pod-data:
    driver: local
  wire-pod-images:
    driver: local
