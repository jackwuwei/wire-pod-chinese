services:
  wire-pod:
    container_name: wire-pod
    build:
      context: .
      dockerfile: dockerfile
    image: jackwuwei/wire-pod-chinese:latest
    restart: unless-stopped
    environment:
      WIREPOD_DATA_DIR: /data
    # Host networking is required. wire-pod records the robot's IP from the
    # connection's source address; with bridge mode + port mapping that is the
    # Docker gateway, so the SDK app dials wire-pod itself ("unknown service
    # ExternalInterface"). mDNS (escapepod.local) also needs it. Ports 80, 443,
    # 8080 and 8084 must be free on the host and can't be remapped.
    # Linux hosts only; Docker Desktop (macOS/Windows) has no real host network.
    network_mode: host
    volumes:
      - wire-pod-data:/data
      - wire-pod-images:/images
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/ok" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  wire-pod-data:
    driver: local
  wire-pod-images:
    driver: local
