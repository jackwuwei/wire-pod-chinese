name: Docker

# Builds a multi-arch (linux/amd64 + linux/arm64) image and pushes it to Docker Hub.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub account name
#   DOCKERHUB_TOKEN     - Docker Hub access token (Account Settings -> Personal access tokens, Read & Write)
# Optional repository variable:
#   DOCKERHUB_IMAGE     - target repo, e.g. "myuser/wire-pod-chinese" (defaults to <DOCKERHUB_USERNAME>/wire-pod-chinese)

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME}/wire-pod-chinese}" >> "$GITHUB_OUTPUT"

      # The Go build cross-compiles natively, but the arm64 runtime stage
      # (apt-get, pip install) runs under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            USE_CN_MIRROR=false
            GOPROXY=https://proxy.golang.org,direct
            PIP_INDEX_URL=https://pypi.org/simple/
          cache-from: type=gha
          cache-to: type=gha,mode=max
